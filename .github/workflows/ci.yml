name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-macos:
    name: Test on macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | command grep -vi beta | sort -V | tail -1)/Contents/Developer"
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version

      # The suite uses exit tests (#expect(processExitsWith:)), which need Swift 6.2.
      - name: Require Swift 6.2 or later
        run: bash scripts/check-swift-version.sh 6.2

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v

      - name: Run the QuickStart example
        run: swift run QuickStart

  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest
    # Swift 6.2 is the floor: the suite uses exit tests (#expect(processExitsWith:)).
    container: swift:6.2-jammy
    steps:
      - uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v

      - name: Run the QuickStart example
        run: swift run QuickStart

  fixture-safety:
    name: PHI scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan fixtures for PHI patterns
        run: |
          bash scripts/scan-fixtures-for-phi.sh --self-test
          bash scripts/scan-fixtures-for-phi.sh
      - name: Scan every committed blob for PHI and licensed content
        run: bash scripts/scan-fixtures-for-phi.sh --history

  codegen-drift:
    name: Codegen drift
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | command grep -vi beta | sort -V | tail -1)/Contents/Developer"
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version
      - name: Regenerate typed segments
        run: bash scripts/regenerate-typed-segments.sh
      - name: Fail if Generated/ is out of date
        run: |
          if ! git diff --exit-code Sources/HL7v2Kit/Segment/Generated/ Sources/HL7v2Kit/Tables/Generated/ Sources/HL7v2Kit/DataTypes/Generated/ Sources/HL7v2Kit/Locale/Generated/ Sources/HL7v2Kit/Composite/Generated/ Sources/HL7v2Kit/Structures/Generated/; then
            echo "::error::Generated typed segments or code tables are out of date. Run scripts/regenerate-typed-segments.sh and commit the result."
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all Sources/HL7v2Kit/Composite/Generated/ Sources/HL7v2Kit/Segment/Generated/ Sources/HL7v2Kit/Structures/Generated/)" ]; then
            echo "::error::Generated files are untracked or out of date. Run scripts/regenerate-typed-segments.sh and commit the result."
            exit 1
          fi
      - name: Pinned struct bases self-check
        run: python3 scripts/check-struct-base-pin.py
      - name: Message-structure codegen self-check
        run: bash scripts/check-structure-codegen.sh

  docc:
    name: DocC
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | command grep -vi beta | sort -V | tail -1)/Contents/Developer"
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version
      - name: Build the documentation catalogue without warnings
        run: |
          # The committed HL7v2Kit.xcworkspace has no scheme, and xcodebuild prefers it to the
          # package, so the package's own scheme is built from a copy without it.
          rsync -a --exclude HL7v2Kit.xcworkspace --exclude .build --exclude .swiftpm ./ "$RUNNER_TEMP/docc-src/"
          cd "$RUNNER_TEMP/docc-src"
          if ! xcodebuild docbuild -scheme HL7v2Kit -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/docc-derived" > "$RUNNER_TEMP/docc.log" 2>&1; then
            tail -40 "$RUNNER_TEMP/docc.log"
            echo "::error::xcodebuild docbuild failed."
            exit 1
          fi
          # Compiler and DocC diagnostics only, not SwiftPM's "warning: '<package>':" echoes.
          warnings="$(grep -E '^[^ ]+\.(swift|md):[0-9]+(:[0-9]+)?: warning:|^warning: ' "$RUNNER_TEMP/docc.log" | grep -vE "^warning: '[^']+': " | sort -u || true)"
          if [ -n "$warnings" ]; then
            echo "$warnings"
            echo "::error::DocC reported warnings."
            exit 1
          fi
          echo "DocC built with no warnings."
